
services:
  postgres:
    build: ./postgres-custom       # <--- Build our local image
    image: custom-postgres:latest  # <--- Tag it
    #image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: postgres-main
    restart: unless-stopped
    environment:
      POSTGRES_USER: 'admin'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: "postgres -c wal_level=logical -c shared_preload_libraries=vectors.so"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11
    container_name: mariadb-main
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - homelab

  redis:
    image: redis:6.2-alpine
    container_name: redis-main
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - homelab
  
  rustical:
    image: ghcr.io/lennart-k/rustical:0.9.12
    container_name: rustical
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - rustical_data:/var/lib/rustical/
    networks:
      - homelab

  surrealdb:
    image: surrealdb/surrealdb:v3.0.5
    container_name: surrealdb-main
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8000:8000" # Target for Tailscale Service
    environment:
      SURREALDB_USER: ${SURREALDB_USER}
      SURREALDB_PASSWORD: ${SURREALDB_PASSWORD}
    volumes:
      - /opt/homelab/data/surreal:/data
    command:
      - start
      - --bind
      - 0.0.0.0:8000
      - --user
      - ${SURREALDB_USER}
      - --pass
      - ${SURREALDB_PASSWORD}
      - --ns
      - main           # Explicitly set the namespace
      - --db
      - homestead
      - surrealkv://data/surreal.db # Forces local NVMe persistence
    networks:
      - homelab
    depends_on:
      - garage # We still depend on garage, even if not for storage, it's a core service
      
     
      # --- CONVEX STACK ---
  convex-backend:
    # Using the official image name and a specific SHA pin for stability
    image: ghcr.io/get-convex/convex-backend:00bd92723422f3bff968230c94ccdeb8c1719832
    container_name: convex-backend
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:8091:3210"
    volumes:
      - convex_data:/convex/data
    environment:
      CONVEX_CLOUD_ORIGIN: 'http://localhost:8091'
      POSTGRES_URL: ${CONVEX_POSTGRES_URL}
      DO_NOT_REQUIRE_SSL: 'true'
      DISABLE_BEACON: 'true'
    networks:
      - homelab
    depends_on:
      postgres:
        condition: service_healthy
      init-postgres:
        condition: service_completed_successfully
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:33cef775a8a6228cbacee4a09ac2c4073d62ed13
    container_name: convex-dashboard
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:6791:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: 'http://localhost:8091'
    networks:
      - homelab
    depends_on:
      convex-backend:
        condition: service_healthy
  init-postgres:
    image: alpine:latest
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: sh -c "apk add --no-cache fish gettext docker-cli && fish init-dbs.fish postgres"
  init-mariadb:
    image: alpine:latest
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_started
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: sh -c "apk add --no-cache fish gettext docker-cli && fish init-dbs.fish mariadb"

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: garage
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "127.0.0.1:3900:3900" # S3 API bound to loopback for Tailscale
      - "127.0.0.1:3902:3902" # S3 Web
      - "127.0.0.1:3903:3903" # Admin API
      - "3901:3901"           # RPC (Keep open for future clustering)
    volumes:
      - /var/lib/garage/meta:/var/lib/garage/meta
      - /mnt/nas/S3/config:/var/lib/garage/data
      - /etc/garage.toml:/etc/garage.toml:ro
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}


  kopia:
    image: kopia/kopia:latest
    container_name: kopia-server
    restart: unless-stopped
    ports:
      - "51515:51515"
    networks:
      - homelab
    volumes:
      - ./config/kopia:/app/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      KOPIA_PASSWORD: ${KOPIA_PASSWORD}
      KOPIA_SERVER_PASSWORD: ${KOPIA_SERVER_PASSWORD}
      GARAGE_KEY_ID: ${GARAGE_KEY_ID}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
    entrypoint: /bin/sh
    command:
      - -c
      - |
          if [ ! -f /app/config/repository.config ]; then
            kopia repository connect s3 \
              --bucket=kopia-backups \
              --endpoint=s3.cuttlefish-gorgon.ts.net \
              --access-key=$GARAGE_KEY_ID \
              --secret-access-key=$GARAGE_SECRET_KEY \
              --region=garage \
              --config-file=/app/config/repository.config;
          fi &&
          exec kopia server start \
            --address=0.0.0.0:51515 \
            --server-username=cparrish \
            --server-control-password=$KOPIA_SERVER_PASSWORD \
            --config-file=/app/config/repository.config \
            --tls-cert-file=/app/config/server.crt \
            --tls-key-file=/app/config/server.key \
            --disable-csrf-token-checks

  teleport:
    image: public.ecr.aws/gravitational/teleport-distroless:16
    container_name: teleport
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./teleport-data:/var/lib/teleport  # <--- Local directory
      - /var/run/docker.sock:/var/run/docker.sock
      - ./teleport.yaml:/etc/teleport/teleport.yaml
    environment:
      # No Roles needed if using config file, but strictly:
      # We rely on the mounted config for full control
      - TELEPORT_CONFIG_FILE=/etc/teleport/teleport.yaml


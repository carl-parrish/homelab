volumes:
  redis_data:
  postgres_data:
  mariadb_data:
  convex_data:
  rustical_data:
#  languagetool_ngrams:
  kopia_repo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/nas/backup/kopia-repo
  garage_meta:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/garage/meta # Local NVMe
  garage_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/nas/S3/data     # Bulk Storage (Fixed path)     
  surrealdb_meta:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/surrealdb/meta # Local NVMe for query speed


networks:
  homelab:
    driver: bridge
